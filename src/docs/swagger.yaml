definitions:
  model.Booking:
    properties:
      booking_id:
        type: string
      dock_id:
        type: string
      end_date:
        type: string
      payment_method:
        type: string
      payment_status:
        type: string
      people:
        type: integer
      sailor_id:
        type: string
      start_date:
        type: string
    type: object
  model.Comment:
    properties:
      comment_id:
        type: string
      content:
        type: string
      guide_id:
        type: string
      timestamp:
        type: string
      user_id:
        type: string
    type: object
  model.DockingSpot:
    properties:
      availability:
        description: '''available'' or ''unavailable'''
        type: string
      description:
        type: string
      dock_id:
        type: string
      location:
        description: latitude, longitude, town
        type: object
      name:
        type: string
      owner_id:
        type: string
      price_per_night:
        type: number
      price_per_person:
        type: number
      services:
        type: string
      services_pricing:
        type: number
    type: object
  model.Guide:
    properties:
      author_id:
        type: string
      content:
        type: string
      guide_id:
        type: string
      images:
        type: object
      is_approved:
        type: boolean
      links:
        type: object
      location:
        description: latitude, longitude
        type: object
      publication_date:
        type: string
      title:
        type: string
    type: object
  model.Notification:
    properties:
      message:
        type: string
      notification_id:
        type: string
      timestamp:
        type: string
      user_id:
        type: string
    type: object
  model.Port:
    properties:
      description:
        type: string
      docking_spots:
        type: object
      is_approved:
        type: boolean
      location:
        description: latitude, longitude, town
        type: object
      name:
        type: string
      owner_id:
        type: string
      port_id:
        type: string
      services:
        type: object
    type: object
  model.Review:
    properties:
      comment:
        type: string
      date_of_review:
        type: string
      rating:
        type: number
      review_id:
        type: string
      reviewer_id:
        type: string
    type: object
  model.User:
    properties:
      email:
        type: string
      name:
        type: string
      phone_number:
        type: string
      role:
        $ref: '#/definitions/model.UserRole'
      surname:
        type: string
      user_id:
        type: string
    type: object
  model.UserRole:
    enum:
    - admin
    - user
    - dock_owner
    - sailor
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleEditor
    - RoleDockOwner
    - RoleSailor
